<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <!-- Pictobi のランチャーアイコン (adaptive icon の background + foreground を合成) -->
  <rect width="108" height="108" rx="24" fill="#0E1B2A"/>
  <g transform="translate(54,54) scale(0.9) translate(-54,-54)">
    <!-- 背面の写真カード -->
    <path d="M42,27 L80,33 L75,73 L37,67 Z" fill="#143A52" stroke="#3B7C8C" stroke-width="2"/>
    <!-- 正面の写真カード -->
    <path d="M34,38 L74,38 A6,6 0 0 1 80,44 L80,80 A6,6 0 0 1 74,86 L34,86 A6,6 0 0 1 28,80 L28,44 A6,6 0 0 1 34,38 Z"
          fill="#173C55" stroke="#8FEBDD" stroke-width="2.5"/>
    <!-- 山 -->
    <path d="M30,80 L42,62 L52,72 L60,64 L78,80 Z" fill="#2C6B78"/>
    <!-- 太陽 -->
    <circle cx="43" cy="50" r="4" fill="#FFB86B"/>
    <!-- 尾羽 -->
    <path d="M57,39 L45,24 L48,36 L41,34 L50,46 Z" fill="#5FE0CB"/>
    <!-- 体 -->
    <path d="M62,33 C70,33 76,39 76,47 C76,56 70,62 62,62 C55,62 50,57 50,51 C50,42 55,33 62,33 Z" fill="#7FE7D4"/>
    <!-- おなか -->
    <path d="M63,44 C68,44 72,48 72,53 C72,58 68,61 63,61 C58,61 55,58 55,54 C55,49 58,44 63,44 Z" fill="#D8FFF7"/>
    <!-- 翼 -->
    <path d="M57,45 C62,41 69,42 73,47 C70,51 66,54 60,54 C56,54 54,50 57,45 Z" fill="#3CC7B3"/>
    <!-- 頭 -->
    <circle cx="71" cy="31" r="7" fill="#7FE7D4"/>
    <!-- くちばし -->
    <path d="M77,35 L86,38 L77,41 Z" fill="#FFB86B"/>
    <!-- 目 -->
    <circle cx="73" cy="34" r="1.8" fill="#0B1524"/>
    <!-- 足 -->
    <path d="M62,61 L61,68" stroke="#FFB86B" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M68,61 L69,68" stroke="#FFB86B" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
