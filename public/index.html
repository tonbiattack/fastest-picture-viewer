<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pictobi</title>
<meta name="description" content="Pictobi — Android 向けの画像ビューア。プライバシーポリシーを掲載しています。">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1b2733;
    --muted: #5b6b7c;
    --accent: #0f6f6b;
    --rule: #e2e8ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1b2a;
      --fg: #e6edf3;
      --muted: #9fb0c0;
      --accent: #7fe7d4;
      --rule: #24384c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans",
      "Noto Sans JP", Meiryo, sans-serif;
    line-height: 1.85;
  }
  main {
    max-width: 520px;
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 32px 28px;
  }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 24px; font-size: 0.95rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li + li { margin-top: 10px; }
  a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  a:hover { text-decoration: underline; }
  .note {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <h1>Pictobi</h1>
  <p class="lead">Android 向けの画像ビューア</p>
  <ul>
    <li><a href="privacy.html">プライバシーポリシー</a></li>
    <li>
      <a href="https://github.com/tonbiattack/fastest-picture-viewer">
        GitHub リポジトリ
      </a>
    </li>
    <li>
      <a href="https://github.com/tonbiattack/fastest-picture-viewer/issues">
        お問い合わせ（GitHub Issues）
      </a>
    </li>
  </ul>
  <p class="note">
    本アプリはネットワーク通信を行わず、個人情報を収集しません。
    詳しくはプライバシーポリシーをご覧ください。
  </p>
</main>
</body>
</html>
